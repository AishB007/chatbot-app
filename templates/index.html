<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Chatbot</title>

    <style>
        body {
            margin: 20px;
            font-family: Arial;
            display: flex;
            background-color: #1e1e1e;
            color: white;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid white;
        }

        .input-area {
            display: flex;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px;
        }

        .user {
            text-align: right;
            margin: 5px;
        }

        .bot {
            text-align: left;
            margin: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 style="text-align:center; margin:10px 0;">🤖 Groq Chatbot</h2>
    <div id="chat-box"></div>
    
    <div class="input-area">
        <input type="text" id="message" placeholder="Type..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("message");
    const chatBox = document.getElementById("chat-box");

    const msg = input.value;

    chatBox.innerHTML += `<div class="user">You: ${msg}</div>`;
    input.value = "";

    const res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    });

    const data = await res.json();

    chatBox.innerHTML += `<div class="bot">Bot: ${data.response}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
